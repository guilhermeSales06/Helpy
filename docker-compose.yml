services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpy
      POSTGRES_PASSWORD: helpy
      POSTGRES_DB: helpy
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpy -d helpy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
