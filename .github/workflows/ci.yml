name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The e2e tests connect to this database. See test/test-env.ts.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpy
          POSTGRES_PASSWORD: helpy
          POSTGRES_DB: helpy
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U helpy -d helpy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
